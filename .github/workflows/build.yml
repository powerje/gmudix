name: Build

on:
  push:
    branches: [default]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK+ 2
        run: brew install gtk+

      - name: Build
        run: make

      - name: Smoke test
        run: |
          file ./gmudix
          test -x ./gmudix

      - uses: actions/upload-artifact@v4
        with:
          name: gmudix-macos-arm64
          path: gmudix
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk2.0-dev \
            libglib2.0-dev \
            zlib1g-dev \
            pkg-config \
            clang \
            make \
            file

      - name: Build
        run: make

      - name: Smoke test
        run: |
          file ./gmudix
          test -x ./gmudix

      - uses: actions/upload-artifact@v4
        with:
          name: gmudix-linux-x86_64
          path: gmudix
          if-no-files-found: error

  windows:
    name: Windows (x86_64, MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib

      - name: Build
        run: make

      - name: Smoke test
        run: |
          file ./gmudix.exe
          test -x ./gmudix.exe

      - uses: actions/upload-artifact@v4
        with:
          name: gmudix-windows-x86_64
          path: gmudix.exe
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release binaries
        run: |
          mkdir -p release
          cp artifacts/gmudix-macos-arm64/gmudix    release/gmudix-macos-arm64
          cp artifacts/gmudix-linux-x86_64/gmudix   release/gmudix-linux-x86_64
          cp artifacts/gmudix-windows-x86_64/gmudix.exe release/gmudix-windows-x86_64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
